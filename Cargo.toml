[workspace]
resolver = "2"
members = ["core", "host", "methods", "methods/guest", "verify", "simulator", "query_host", "query_methods", "query_methods/guest", "query_verify"]

# Common dependencies for the workspace
[workspace.dependencies]
dotenv = "0.15.0"
clap = { version = "4.5", features = ["derive"] }
serde = "1.0.219"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-appender = "0.2.3"
tokio = { version = "1.45.1", features = ["full"] }
tokio-postgres = "0.7.13"
bincode = "1.3"
rand = "0.9.1"
risc0-zkvm = "^3.0"
sha2 = "0.10.9"
hex = "0.4.3"
merkle_light = "0.4.0"

# Always optimize; building and running the guest takes much longer without optimization.
[profile.dev]
opt-level = 3

[profile.release]
debug = 1
lto = true
